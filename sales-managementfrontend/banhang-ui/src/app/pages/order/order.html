<div class="container">

  <h2>🧾 Danh sách đơn hàng</h2>

  <p>
    Tổng số đơn:
    {{ orders().length }}
  </p>

  <table class="table table-striped table-bordered">

    <thead class="table-dark">

      <tr>
        <th>ID</th>
        <th>Khách hàng</th>
        <th>Tổng tiền</th>
        <th>Số sản phẩm</th>
        <th>Thao tác</th>
      </tr>

    </thead>

    <tbody>

      @for(order of orders(); track order.id){

        <tr>

          <td>
  {{ order.orderId }}
</td>

<td>
  {{ order.customerId }}
</td>

<td class="text-success fw-bold">
  {{ order.total | number }}
  VNĐ
</td>

<td>
  {{ order.itemCount }}
</td>

<td>

  <button
    class="btn btn-primary btn-sm"
    (click)="exportInvoice(order.orderId)">

    Xuất hóa đơn

  </button>

</td>
        </tr>

      }

    </tbody>

  </table>

</div>
