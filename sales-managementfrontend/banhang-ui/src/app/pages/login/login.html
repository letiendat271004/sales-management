<div class="container mt-5">

  <div class="card mx-auto p-4 shadow"
       style="max-width:400px">

    <h3 class="mb-4 text-center">
      Đăng nhập
    </h3>

    <input
      class="form-control mb-3"
      placeholder="Username"
      [(ngModel)]="username">

    <input
      type="password"
      class="form-control mb-3"
      placeholder="Password"
      [(ngModel)]="password">

    <button
      class="btn btn-primary w-100"
      (click)="login()">

      Đăng nhập

    </button>

  </div>

</div>
